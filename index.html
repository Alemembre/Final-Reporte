const fromInput = document.getElementById('fromDate');
const toInput = document.getElementById('toDate');
const accountInput = document.getElementById('account');
const guideTrigger = document.getElementById('guideTrigger');
const guidePanel = document.getElementById('guidePanel');
const guideOptions = document.getElementById('guideOptions');
const guideSummary = document.getElementById('guideSummary');
const guideCount = document.getElementById('guideCount');
const guideSearch = document.getElementById('guideSearch');
let availableGuides = [];
let selectedGuides = new Set();

function getAvailableRows(){
  const from = fromInput.value || '0000-01-01';
  const to = toInput.value || '9999-12-31';
  const account = accountInput.value;
  return DATA.filter(row => (account === 'all' || row.account === account) && row.date >= from && row.date <= to);
}
function refreshGuideOptions(reset=true){
  const rows = getAvailableRows();
  const nextGuides = [...new Set(rows.map(row => row.cells[2]))].sort();
  const nextSet = new Set(nextGuides);
  if(reset){
    selectedGuides = new Set(nextGuides);
  } else {
    selectedGuides = new Set([...selectedGuides].filter(g => nextSet.has(g)));
  }
  availableGuides = nextGuides;
  renderGuideOptions();
  updateGuideSummary();
}
function updateGuideSummary(){
  const n = selectedGuides.size, total = availableGuides.length;
  if(total===0) guideSummary.textContent='Sin guías disponibles';
  else if(n===total) guideSummary.textContent=`Todas las guías (${total})`;
  else if(n===0) guideSummary.textContent='Ninguna guía seleccionada';
  else guideSummary.textContent=`${n} de ${total} guías seleccionadas`;
  guideCount.textContent=`${n}/${total} seleccionadas`;
}
function renderGuideOptions(){
  const q = guideSearch.value.trim().toLowerCase();
  guideOptions.innerHTML='';
  const filtered = availableGuides.filter(g => g.toLowerCase().includes(q));
  if(filtered.length===0){
    const empty=document.createElement('div'); empty.className='guide-option'; empty.style.color='#68727d'; empty.textContent='No hay guías disponibles'; guideOptions.appendChild(empty); return;
  }
  const frag=document.createDocumentFragment();
  for(const guide of filtered){
    const label=document.createElement('label'); label.className='guide-option';
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=selectedGuides.has(guide); cb.value=guide;
    cb.addEventListener('change',()=>{if(cb.checked) selectedGuides.add(guide); else selectedGuides.delete(guide); updateGuideSummary();});
    const span=document.createElement('span'); span.textContent=guide;
    label.append(cb,span); frag.appendChild(label);
  }
  guideOptions.appendChild(frag);
}
function renderTable(rows){
  const headerRow=document.getElementById('tableHeaders');
  headerRow.innerHTML='';
  HEADERS.forEach(text=>{const th=document.createElement('th');th.textContent=text;headerRow.appendChild(th);});
  const body=document.getElementById('tableBody'); body.innerHTML='';
  if(rows.length===0){
    const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=HEADERS.length;td.className='empty';td.textContent='No hay registros para los parámetros seleccionados.';tr.appendChild(td);body.appendChild(tr);
  }else{
    const frag=document.createDocumentFragment();
    for(const row of rows){
      const tr=document.createElement('tr');
      row.cells.forEach((value,i)=>{
        const td=document.createElement('td');td.textContent=value;
        if(i===0)td.classList.add('date');
        if(i===2)td.classList.add('guide');
        if([3,4,5,6,7,8].includes(i))td.classList.add('numeric');
        if(i>=9)td.classList.add('audit');
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    }
    body.appendChild(frag);
  }
  document.getElementById('resultCount').textContent=`${rows.length} ${rows.length===1?'registro':'registros'}`;
  document.getElementById('footerCount').textContent=`${rows.length} ${rows.length===1?'registro':'registros'}`;
}
function applyReport(){
  if(fromInput.value && toInput.value && fromInput.value>toInput.value){
    alert('La fecha Desde no puede ser posterior a la fecha Hasta.'); return;
  }
  const rows=getAvailableRows().filter(row=>selectedGuides.has(row.cells[2]));
  renderTable(rows);
  guidePanel.classList.remove('open');guideTrigger.setAttribute('aria-expanded','false');
}
fromInput.addEventListener('change',()=>refreshGuideOptions(true));
toInput.addEventListener('change',()=>refreshGuideOptions(true));
accountInput.addEventListener('change',()=>refreshGuideOptions(true));
guideTrigger.addEventListener('click',()=>{
  const open=!guidePanel.classList.contains('open');guidePanel.classList.toggle('open',open);guideTrigger.setAttribute('aria-expanded',String(open));
  if(open){guideSearch.value='';renderGuideOptions();guideSearch.focus();}
});
guideSearch.addEventListener('input',renderGuideOptions);
document.getElementById('selectAll').addEventListener('click',()=>{selectedGuides=new Set(availableGuides);renderGuideOptions();updateGuideSummary();});
document.getElementById('clearAll').addEventListener('click',()=>{selectedGuides.clear();renderGuideOptions();updateGuideSummary();});
document.getElementById('runReport').addEventListener('click',applyReport);
document.addEventListener('click',event=>{if(!event.target.closest('.multi-wrap')){guidePanel.classList.remove('open');guideTrigger.setAttribute('aria-expanded','false');}});

refreshGuideOptions(true);
applyReport();
</script>
